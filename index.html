function sendChat(){const i=$('ct'),t=i.value.trim().slice(0,60);if(!t)return;if(Date.now()-lastChat<800){say('조금 천천히 말해요 💬');return}lastChat=Date.now();i.value='';net.send({t:'chat',x:t})}
function arrive(a){
if(a.t==='cook'){startCook(a.d);return}
if(a.t==='sit'){net.send({t:'sit',q:a.q});return}
if(a.t==='serve'){const e=hand&&[...av.values()].find(x=>x.p.q>=0&&(x.p.q>>2)===a.i&&x.p.st===1&&x.p.o===hand.d);
if(!e){const w=[...av.values()].some(x=>(x.p.q>>2)===a.i&&x.p.st===1);say(w?'앗, 주문한 메뉴가 아니에요!':'그 테이블엔 주문한 손님이 없어요');sfx('err');return}net.send({t:'serve',to:e.id});sfx('serve');return}
if(a.t==='clean'){if(!dirty(a.i)){say('이미 깨끗해요');return}setA(2,2500,'clean',()=>net.send({t:'clean',i:a.i}));return}
if(a.t==='kiosk'){if(canPay())pay();else{say('식사를 마친 뒤 키오스크에서 결제해요');sfx('err')}return}
if(a.t==='harvest'){if(plotReady(a.i)<0){say('이미 수확됐어요');return}me.ry=0;setA(2,1400,'harvest',()=>net.send({t:'harvest',i:a.i}));return}
if(a.t==='feed'){me.ry=-1.57;for(let i=0;i<7;i++){const m=sp(.13,'#FFD27A',0,0,0);m.position.set(me.x,1,me.z);sc.add(m);PEL.push({m,t:-i*.12,sx:me.x,sz:me.z,tx:-12.4+Math.random()*1.2,tz:36.8+Math.random()*2.4})}duckT=8;setA(2,1300,'quack');setTimeout(()=>sfx('quack'),500);say('🦆 오리들이 몰려와요! 꽥꽥');return}
if(a.t==='busk'){if(Date.now()-lastBusk<10000){say('잠깐 쉬었다 해요 🎤 (쿨타임)');sfx('err');return}lastBusk=Date.now();me.ry=0;const g=a.m===1;setA(g?5:7,5000,g?'guitar':'bboy',()=>net.send({t:'busk'}));if(g)duck(5500);say(g?'🎸 기타 연주 중…':'🕺 비보이 댄스 시작!');return}
if(a.t==='fire'){me.a=8;me.ry=FS[a.i].ry;pub();sfx('crackle');say('🔥 불멍 중… 타닥타닥 마음이 편안해요 (다른 곳을 누르면 일어나요)')}}
function albaTick(a,dt){const claimed=new Set(albas.map(x=>x.job));let mvg=0;
if(a.job<0){a.wait-=dt;if(a.wait<=0){let b=-1,bd=1e9;TB.forEach((t,i)=>{if(!dirty(i)||claimed.has(i))return;const d=Math.hypot(t.x-a.g.position.x,t.z-a.g.position.z);if(d<bd){bd=d;b=i}});if(b>=0){a.job=b;a.tx=TB[b].x;a.tz=TB[b].z+2.6;a.w=0}else{a.wait=2+Math.random()*2;a.tx=-18+Math.random()*36;a.tz=12+Math.random()*5}}}
const dx=a.tx-a.g.position.x,dz=a.tz-a.g.position.z,d=Math.hypot(dx,dz);
if(d>.12){const s=Math.min(d,5*dt);a.g.position.x+=dx/d*s;a.g.position.z+=dz/d*s;a.g.rotation.y=Math.atan2(dx,dz);mvg=1}
else if(a.job>=0){if(a.w<=0)a.w=2.2;a.w-=dt;anim(a.g,2,0);if(a.w<=0){const j=a.job;a.job=-1;a.wait=.8;if(dirty(j))net.send({t:'albaclean',i:j})}return}
anim(a.g,0,mvg)}
async function saveShot(){if(!lastPhoto)return;const a=document.createElement('a');a.href=URL.createObjectURL(lastPhoto);a.download='bunsik-photo.png';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);say('사진을 저장했어요!')}
const pick={h:0,s:0};try{const v=+localStorage.getItem('bsko_pk');if(v>=0&&v<48){pick.h=v%6;pick.s=v/6|0}}catch(e){}
function buildPick(){const el=$('pk');el.innerHTML='<p><small>머리색</small></p><div class="sw" id="sw1"></div><p><small>옷 색</small></p><div class="sw" id="sw2"></div>';
const mkb=(c,on,lab,f,box)=>{const b=document.createElement('button');b.style.background=c;b.setAttribute('aria-label',lab);if(on)b.className='on';b.onclick=()=>{f();buildPick();sfx('tap')};$(box).appendChild(b)};
HR.forEach((c,i)=>mkb(c,i===pick.h,'머리색 '+(i+1),()=>pick.h=i,'sw1'));SH.forEach((c,i)=>mkb(c,i===pick.s,'옷 색 '+(i+1),()=>pick.s=i,'sw2'))}
function start(r){ac();bgmStart();const n=$('nk').value.trim().slice(0,8);if(!n){$('rs').textContent='닉네임을 입력해 주세요';return}
me.c=pick.h+6*pick.s;try{localStorage.setItem('bsko_n',n);localStorage.setItem('bsko_pk',String(me.c))}catch(e){}
net.n=n;net.r=r;$('rs').textContent='접속 중…';if(net.joined&&net.ready){net.send({t:'role',r,c:me.c});return}net.connect()}
async function init(){build();rs();PL.position.set(0,0,21);buildPick();requestAnimationFrame(loop);$('rs').textContent=''}
$('bp').onclick=()=>{if(canPay())toKiosk();else{say(me.st===0?'주문하고 식사한 뒤에 결제해요':me.st===2&&me.q>=0?'일어나서 키오스크로 가요':'아직 식사 전이에요');sfx('err')}};
$('bs').onclick=()=>{if(me.q>=0){if(me.st===1||(me.st===2&&srv()<me.eu)){say('식사를 마친 뒤 일어날 수 있어요');sfx('err');return}net.send({t:'stand'});return}const i=nearest(t=>freeSeat(t)>=0);if(i<0){say('빈 자리가 없어요');sfx('err');return}sit(i)};
$('bd').onclick=()=>{if(Date.now()-lastDance<6000){say('호객 쿨타임이에요 💦');sfx('err');return}lastDance=Date.now();setA(1,3000,'dance',()=>net.send({t:'dance'}));say('손님~ 들어오세요! 💃')};
$('cg').onclick=()=>{if(Date.now()-lastGreet<8000){say('인사 쿨타임이에요 😊');sfx('err');return}lastGreet=Date.now();setA(3,2500,'wave',()=>net.send({t:'greet'}));say('👋 어서오세요~!')};
$('cs').onclick=()=>{if(Date.now()-lastShow<12000){say('불이 식을 때까지 기다려요 🔥');sfx('err');return}lastShow=Date.now();setA(4,4000,'fire',()=>net.send({t:'show'}));say('🔥 불쇼 나갑니다!')};
$('bx').onclick=()=>{if(me.st!==1){say(me.st===2?'이미 음식이 나왔어요. 키오스크에서 결제해요':'취소할 주문이 없어요');sfx('err');return}net.send({t:'cancel'})};
$('mn').onclick=()=>{if(!run)return;if(me.q>=0||me.st!==0||hand||cook){say('앉아 있거나 주문·요리 중에는 바꿀 수 없어요');sfx('err');return}run=0;$('rs').textContent='직업을 다시 골라요';$('ov').style.display='flex';$('acts').style.display='none';$('cacts').style.display='none';$('board').innerHTML=''};
(document.fonts?document.fonts.load('40px Jua').then(init,init):Promise.resolve().then(init));
